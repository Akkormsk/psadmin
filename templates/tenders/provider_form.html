{% extends "base.html" %}{% block content %}<h1>Добавить подрядчика</h1><form method="post" enctype="multipart/form-data">{% csrf_token %}<p><label>Название<br><input name="name" required></label></p><p><b>Возможности</b><br>{% for stage in stages %}<label><input type="checkbox" name="stages" value="{{ stage.pk }}"> {{ stage.name }}</label><br>{% endfor %}</p><p><label>Текст, прайс или переписка<br><textarea name="text" rows="8"></textarea></label></p><p><label>Файл (XLS/XLSX/CSV/PDF/изображение)<br><input type="file" name="source"></label></p><button class="btn btn-primary">Продолжить</button></form>{% endblock %}

{% extends "base.html" %}{% block content %}
<main class="container provider-list-page"><h1>База подрядчиков</h1><p><a class="button-success" href="{% url 'provider_create' %}">Добавить подрядчика</a></p><section class="provider-list">{% for provider in providers %}<button type="button" class="provider-list__card" data-provider-workspace="{% url 'provider_workspace' provider.pk %}"><strong>{{ provider.name }}</strong><span>{% for link in provider.stage_links.all %}{{ link.stage.name }}{% if not forloop.last %} · {% endif %}{% endfor %}</span><small>{% if provider.confirmed %}Есть подтверждённый прайс{% else %}Прайс пока не подтверждён{% endif %}</small></button>{% empty %}<p>Подрядчиков пока нет.</p>{% endfor %}</section></main>
<div class="provider-modal" id="provider-modal" hidden><div class="provider-modal__backdrop" data-provider-close></div><section class="provider-modal__dialog" role="dialog" aria-modal="true" aria-label="Карточка контрагента"><div id="provider-modal-content"></div></section></div>
<script>(function(){const modal=document.getElementById("provider-modal"),content=document.getElementById("provider-modal-content");let url="";function close(){modal.hidden=true;content.innerHTML="";document.body.classList.remove("provider-modal-open");}function load(next,options){url=next;return fetch(next,options).then(r=>r.text()).then(html=>{content.innerHTML=html;modal.hidden=false;document.body.classList.add("provider-modal-open");});}document.addEventListener("click",e=>{const opener=e.target.closest("[data-provider-workspace]");if(opener){load(opener.dataset.providerWorkspace);return;}if(e.target.closest("[data-provider-close]")){close();return;}const tab=e.target.closest("[data-provider-tab]");if(tab){load(url.split("?")[0]+"?tab="+tab.dataset.providerTab);}});document.addEventListener("submit",e=>{const form=e.target.closest("[data-provider-calculator-form]");if(!form)return;e.preventDefault();load(url.split("?")[0],{method:"POST",headers:{"X-CSRFToken":form.querySelector("[name=csrfmiddlewaretoken]").value},body:new FormData(form)});});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)close();});})();</script>
{% endblock %}

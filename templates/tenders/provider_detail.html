{% extends "base.html" %}{% block content %}<main class="container provider-detail-page"><a class="back-link" href="{% url 'provider_list' %}">← База подрядчиков</a><section class="provider-detail-page__card">{% include "tenders/_provider_workspace.html" %}</section></main><script>(function(){const card=document.querySelector(".provider-detail-page__card"),url="{% url 'provider_workspace' provider.pk %}";function load(next,options){return fetch(next,options).then(r=>r.text()).then(html=>{card.innerHTML=html;});}document.addEventListener("click",e=>{const tab=e.target.closest("[data-provider-tab]");if(!tab)return;e.preventDefault();load(url+"?tab="+tab.dataset.providerTab);});document.addEventListener("submit",e=>{const form=e.target.closest("[data-provider-calculator-form]");if(!form)return;e.preventDefault();load(url,{method:"POST",headers:{"X-CSRFToken":form.querySelector("[name=csrfmiddlewaretoken]").value},body:new FormData(form)});});})();</script>{% endblock %}

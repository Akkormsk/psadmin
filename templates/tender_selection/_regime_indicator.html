<span class="ts-regime-indicator" data-regime-indicator data-regime="{{ regime.status|default:'unknown' }}" role="img" aria-label="{{ regime.label|default:'1875: не указано' }}. {{ regime.description }}">
  <span class="ts-regime-dot" aria-hidden="true"></span>
  <span class="ts-regime-tooltip" role="tooltip">{{ regime.label|default:'1875: не указано' }}{% if regime.description %}<span>{{ regime.description }}</span>{% endif %}</span>
</span>

{% if product_editor_error %}<p class="ts-warn" role="status">{{ product_editor_error }}</p>{% endif %}
{% if product_editor %}
{{ product_editor|json_script:"ts-product-editor-data" }}
<section data-product-editor data-save-url="{% url 'tender_selection:save_products' tender.pk %}">
  <div class="ts-product-edit-toolbar">
    <div data-product-view-actions><button type="button" class="ts-quiet" data-product-add>+ Добавить товар</button><button type="button" class="ts-quiet" data-product-edit>Редактировать</button></div>
    <div data-product-edit-actions hidden><button type="button" class="button-success" data-product-save>Сохранить</button><button type="button" class="button-secondary" data-product-cancel>Отмена</button><button type="button" class="ts-quiet" data-product-add>+ Добавить товар</button></div>
    <span class="ts-sub" data-product-edit-status role="status"></span>
  </div>
  <div data-product-edit-table hidden></div>
</section>
{% endif %}

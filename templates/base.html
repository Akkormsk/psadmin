{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PSADMIN{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/index.css' %}">
</head>
<body>
    {% if messages %}
    <div class="container">
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    {% block content %}{% endblock %}
</body>
</html>

<span class="user-mini-avatar" aria-hidden="true">
  {% if user.profile.avatar_updated_at %}<img src="{% url 'user_avatar' user.pk %}" alt="">{% else %}<span>{% if user.first_name or user.last_name %}{{ user.first_name|slice:":1" }}{{ user.last_name|slice:":1" }}{% else %}?{% endif %}</span>{% endif %}
</span>

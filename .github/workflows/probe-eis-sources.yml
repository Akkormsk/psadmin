name: Probe real EIS sources read only
on:
  push:
    branches: [feature/source-filter-settings]
    paths: ['scripts/probe_eis_sources.py', '.github/workflows/probe-eis-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read EIS from TEST server
        env:
          SSH_HOST: ${{ secrets.PSADMIN_TEST_SSH_HOST }}
          SSH_KEY: ${{ secrets.PSADMIN_TEST_SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.PSADMIN_TEST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$SSH_HOST" \
            'docker exec -i psadmin-test-test-web-1 python manage.py shell --no-imports' < scripts/probe_eis_sources.py

name: Probe real EIS sources read only
on:
  push:
    branches: [feature/source-filter-settings]
    paths: ['scripts/probe_eis_sources.py', '.github/workflows/probe-eis-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Independent network TLS probe without credentials
        run: |
          python - <<'PY'
          import socket, ssl, json
          for host in ('int44.zakupki.gov.ru', 'int.zakupki.gov.ru', 'zakupki.gov.ru'):
              result = {'independent_host': host}
              try:
                  result['addresses'] = sorted({a[4][0] for a in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
                  with socket.create_connection((host,443),timeout=10) as sock:
                      result['tcp_ok'] = True
                      with ssl.create_default_context().wrap_socket(sock,server_hostname=host) as secure:
                          result['tls'] = secure.version()
              except Exception as exc:
                  result['error'] = type(exc).__name__
                  result['reason'] = str(exc)[:200]
              print(json.dumps(result),flush=True)
          PY
      - name: Read EIS from TEST server
        env:
          SSH_HOST: ${{ secrets.PSADMIN_TEST_SSH_HOST }}
          SSH_KEY: ${{ secrets.PSADMIN_TEST_SSH_PRIVATE_KEY }}
          SSH_HOSTS: ${{ secrets.PSADMIN_TEST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$SSH_HOST" \
            'docker exec -i psadmin-test-test-web-1 python manage.py shell --no-imports' < scripts/probe_eis_sources.py

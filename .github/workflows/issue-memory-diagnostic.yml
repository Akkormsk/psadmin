name: Inspect one TEST tender (read only)
on:
  push:
    branches: [feature/issue-memory]
    paths: ['.github/workflows/issue-memory-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.PSADMIN_TEST_SSH_HOST }}
      SSH_USER: deploy
      SSH_PRIVATE_KEY: ${{ secrets.PSADMIN_TEST_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PSADMIN_TEST_SSH_KNOWN_HOSTS }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Inspect saved diagnostics without changes or model calls
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMIT_MESSAGE" =~ ^diagnose\ tender\ ([0-9]{19})$ ]]
          number="${BASH_REMATCH[1]}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" "cd /home/deploy/psadmin-test/deploy/vds && docker compose -f compose.test.yml exec -T -e INSPECT_TENDER_NUMBER=$number test-web python -u -" <<'PY'
          import json, os, re
          from pathlib import Path
          from collections import Counter
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'mysite.settings')
          import django
          django.setup()
          from django.db import connection, transaction
          from tender_selection.models import Tender, TenderDocument, DocumentPreview
          from tender_selection.notification import parse_notification
          from tenders.models import TenderComputeJob

          def clean(value):
              if value is None:
                  return None
              value = str(value)[:1200]
              value = re.sub(r'https?://\S+', '[url]', value)
              value = re.sub(r'(?i)(bearer\s+|(?:token|secret|password|api[_-]?key)\s*[:=]\s*)[^\s,;]+', r'\1[redacted]', value)
              return value

          def error_value(value):
              if isinstance(value, dict):
                  return {k: clean(value.get(k)) for k in ('class', 'message', 'code', 'reason') if value.get(k)}
              return clean(value)

          assert connection.vendor == 'postgresql'
          with transaction.atomic():
              with connection.cursor() as cursor:
                  cursor.execute('SET TRANSACTION READ ONLY')
              number = os.environ['INSPECT_TENDER_NUMBER']
              assert re.fullmatch(r'[0-9]{19}', number)
              tender = Tender.objects.get(purchase_number=number)
              report = {'number': number, 'read_only': True, 'model_called': False,
                        'runtime': Path('/app/.twin-version').read_text().strip(), 'jobs': [], 'documents': []}
              for job in TenderComputeJob.objects.filter(tender=tender, version__startswith='v2').order_by('-pk')[:3]:
                  d = job.diagnostics or {}
                  stages = {}
                  for name, row in (d.get('stages') or {}).items():
                      if not isinstance(row, dict):
                          continue
                      state = row.get('state')
                      if state not in ('complete', 'pending') or row.get('error'):
                          stages[name] = {'state': state, 'error': error_value(row.get('error')),
                              'reason': clean(row.get('reason')), 'failure_reason': clean(row.get('failure_reason')),
                              'fragment_count': len(row.get('fragment_ids') or [])}
                  read = d.get('source_reading') or {}
                  gaps = [{k: clean(g.get(k)) for k in ('stage','key','reason','name') if g.get(k) is not None}
                          for g in (d.get('analysis_gaps') or []) if isinstance(g, dict)]
                  entries = d.get('enrichment') or []
                  if isinstance(entries, dict):
                      entries = [entries]
                  report['jobs'].append({'id': job.pk, 'version': job.version, 'status': job.status,
                      'completed_at': str(job.completed_at), 'error': error_value(job.error),
                      'stages': stages, 'stage_states': {k:v.get('state') for k,v in (d.get('stages') or {}).items() if isinstance(v,dict)},
                      'gaps': gaps[:60], 'reading': {k: read.get(k) for k in ('read','total','complete')},
                      'enrichment_state': d.get('enrichment_state'),
                      'enrichment_failures': [{'outcome': e.get('outcome'), 'reason': clean(e.get('final_failure_reason')),
                          'rejections': dict(Counter(str(x.get('reason')) for x in (e.get('extraction') or {}).get('rejections', []) if isinstance(x,dict)))}
                          for e in entries if isinstance(e,dict) and (e.get('final_failure_reason') or (e.get('extraction') or {}).get('rejections'))]})
              for doc in parse_notification(tender.notification_raw or {}).get('documents', []):
                  url = doc.get('url') or ''
                  link = TenderDocument.objects.filter(tender=tender, source_key=url, is_current=True).select_related('preview').order_by('-pk').first()
                  preview = link.preview if link else DocumentPreview.objects.filter(url=url).order_by('-pk').first()
                  report['documents'].append({'name': clean(doc.get('name')), 'cached': bool(preview),
                      'kind': preview.kind if preview else None, 'error': clean(preview.error) if preview else None})
              print(json.dumps(report, ensure_ascii=False, default=str))
          PY

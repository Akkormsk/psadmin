name: Verify one tender composition on test

"on":
  workflow_dispatch:
    inputs:
      tender_id:
        description: "Production tender primary key to copy and inspect"
        required: true
        default: "2042"
        type: string
      model:
        description: "AI model for this one review (empty = server default)"
        required: false
        default: ""
        type: string
      fresh_documents:
        description: "Delete the application document cache and fetch the documents again from EIS"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: psadmin-test-vds-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.PSADMIN_TEST_SSH_HOST }}
      SSH_USER: deploy
      TENDER_ID: ${{ inputs.tender_id }}
      TENDER_MODEL: ${{ inputs.model }}
      FRESH_DOCUMENTS: ${{ inputs.fresh_documents }}
    steps:
      - name: Validate identifier and configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PSADMIN_TEST_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PSADMIN_TEST_SSH_KNOWN_HOSTS }}
        run: |
          set -euxo pipefail
          case "$TENDER_ID" in ''|*[!0-9]*) exit 2;; esac
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy one tender to test and run one document review
        run: |
          set -euo pipefail
          case "$TENDER_MODEL" in *[![:alnum:]./_-]*) echo "invalid model" >&2; exit 2;; esac
          case "$FRESH_DOCUMENTS" in true|false) ;; *) echo "invalid fresh_documents" >&2; exit 2;; esac
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$TENDER_ID' '$TENDER_MODEL' '$FRESH_DOCUMENTS'" <<'REMOTE'
          set -euxo pipefail
          tender_id="$1"; model="$2"; fresh_documents="$3"; root=/home/deploy; prod="$root/psadmin/deploy/vds/compose.yml"; test="$root/psadmin-test/deploy/vds/compose.test.yml"; fixture="$(mktemp /tmp/one-tender.XXXXXX.json)"
          case "$model" in *[![:alnum:]./_-]*) echo "invalid model" >&2; exit 2;; esac
          case "$fresh_documents" in true|false) ;; *) echo "invalid fresh_documents" >&2; exit 2;; esac
          echo "remote: copying tender ${tender_id}"
          cleanup() { status=$?; rm -f "$fixture"; exit "$status"; }; trap cleanup EXIT
          docker compose -f "$prod" exec -T web python manage.py shell --no-imports -c "
          import json
          from django.forms.models import model_to_dict
          from django.core.serializers.json import DjangoJSONEncoder
          from tender_selection.models import Tender, DocumentPreview
          from tender_selection.notification import parse_notification
          t=Tender.objects.get(pk=$tender_id)
          urls=[d.get('url') for d in parse_notification(t.notification_raw).get('documents',[]) if d.get('url')]
          print(json.dumps({'pk':t.pk,'tender':model_to_dict(t),'documents':[model_to_dict(d) for d in DocumentPreview.objects.filter(url__in=urls)]}, cls=DjangoJSONEncoder))
          " </dev/null > "$fixture"
          echo "remote: exported production fixture"
          docker compose -f "$test" run --rm -T test-web python manage.py shell --no-imports -c "
          import json,sys
          from tender_selection.models import Tender,DocumentPreview
          from tenders.models import TenderComputeJob,TenderSourceItem
          from django.db import connection
          with connection.cursor() as c: c.execute('ALTER TABLE tender_selection_tender ALTER COLUMN profile_model DROP NOT NULL; ALTER TABLE tender_selection_tender ALTER COLUMN profile_reason DROP NOT NULL')
          p=json.load(sys.stdin); fields={f.name for f in Tender._meta.fields}; p['tender']={k:v for k,v in p['tender'].items() if k in fields}; TenderComputeJob.objects.filter(tender_id=p['pk']).delete(); TenderSourceItem.objects.filter(tender_id=p['pk']).delete(); Tender.objects.filter(pk=p['pk']).delete(); Tender.objects.create(pk=p['pk'],**p['tender'])
          for d in p['documents']: DocumentPreview.objects.update_or_create(url=d['url'],defaults=d)
          print(json.dumps({'copied_tender':p['pk'],'documents':len(p['documents'])}))
          " < "$fixture"
          echo "remote: imported test fixture"
          docker compose -f "$test" run --rm -T test-web python manage.py shell --no-imports -c "
          import json
          from tender_selection.models import Tender,DocumentPreview
          from tender_selection.notification import parse_notification
          from tender_selection.services import documents_html
          from tenders.models import TenderComputeJob,TenderSourceItem
          from tenders.calculation_v2_pipeline import GatewayDocumentEnricher,run_next_tender_understanding_job
          t=Tender.objects.get(pk=$tender_id); docs=parse_notification(t.notification_raw).get('documents',[]); urls=[d.get('url') for d in docs if d.get('url')]
          TenderComputeJob.objects.filter(tender=t).delete(); TenderSourceItem.objects.filter(tender=t,source_type='document_proposal').delete()
          if '$fresh_documents' == 'true':
              DocumentPreview.objects.filter(url__in=urls).delete(); documents_html(t, docs)
          TenderComputeJob.objects.create(tender=t,trigger='manual_document_review',version='v2')
          j=run_next_tender_understanding_job(enricher=GatewayDocumentEnricher(model='$model') if '$model' else None)
          assert j and j.tender_id==t.pk, 'wrong queued job'
          proposals=[{'parent':item.parent.original_text if item.parent_id else '', 'name':item.original_text, 'quantity':str(item.quantity or ''), 'unit':item.unit, 'relationship':item.metadata.get('relationship'), 'quantity_per_parent':item.metadata.get('quantity_per_parent'), 'requirements':item.requirements, 'source':item.provenance.get('document_url'), 'section':item.provenance.get('page_or_section'), 'evidence':item.provenance.get('evidence')} for item in TenderSourceItem.objects.filter(tender=t,source_type='document_proposal',is_active=False).select_related('parent').order_by('parent_id','pk')]
          print(json.dumps({'job_id':j.pk,'status':j.status,'cost_rub':str(j.total_cost),'fresh_documents':'$fresh_documents' == 'true','model':'$model' or None,'proposals':proposals,'diagnostics':j.diagnostics},ensure_ascii=False,default=str))
          " </dev/null
          echo "remote: completed tender ${tender_id}"
          REMOTE

name: EAT Berezka read-only legal basis verification

on:
  push:
    branches:
      - feature/eat-readonly-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect EAT legal basis of sample session
        env:
          EAT_API_TOKEN: ${{ secrets.EAT_API_TOKEN }}
          EAT_SAMPLE_NUMBER: '100076455126100040'
        run: python3 scripts/eat_detail_probe.py

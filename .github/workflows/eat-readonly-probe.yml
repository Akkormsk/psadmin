name: EAT Berezka read-only API diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Query read-only EAT list API
        env:
          EAT_API_TOKEN: ${{ secrets.EAT_API_TOKEN }}
          EAT_EXT_SYSTEM: '300911501'
        run: python3 scripts/eat_api_diagnostic.py

name: EAT Berezka read-only published date range check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check EAT publication window
        env:
          EAT_API_TOKEN: ${{ secrets.EAT_API_TOKEN }}
          EAT_EXT_SYSTEM: '300911501'
        run: python3 scripts/eat_published_probe.py

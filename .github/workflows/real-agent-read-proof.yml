name: Real Django business read proof (no deploy)
on:
  push:
    branches:
      - feature/m31-functional-agent
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: isolated-real-business-proof
      DJANGO_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - name: Execute actual registered business function against actual Django database
        run: |
          python manage.py shell <<'PY'
          from decimal import Decimal
          from django.utils import timezone
          from datetime import timedelta
          from django.contrib.auth import get_user_model
          from tender_selection.models import Tender, FilterSettings
          from tenders.assistant_tools import available_tools, execute_tool, AssistantToolConfirmationRequired

          owner = get_user_model().objects.create_superuser(username="proof", email="proof@example.invalid", password="not-used")
          settings = FilterSettings.load()
          settings.include_words = ""
          settings.exclude_words = ""
          settings.min_price = Decimal("0")
          settings.save()
          Tender.objects.create(purchase_number="REAL-001", title="Папки для проверки", max_price=Decimal("120050.34"),
                                status=Tender.NEW, review=Tender.UNREVIEWED,
                                collecting_finished_at=timezone.now()+timedelta(days=7))
          Tender.objects.create(purchase_number="REAL-002", title="Скрытые папки", max_price=Decimal("50000"),
                                status=Tender.DISMISSED, review=Tender.UNREVIEWED)
          catalog = {tool["id"]:tool for tool in available_tools(owner)}
          assert catalog["tender.list"]["read_only"] is True
          result = execute_tool("tender.list", owner, {"scope":"incoming","limit":5})
          assert len(result["items"]) == 1, result
          assert result["items"][0]["number"] == "REAL-001", result
          assert result["items"][0]["maximum_price"] == "120050.34", result
          assert "НМЦК" in result["display_text"] and "REAL-001" in result["display_text"], result
          print("PASS: actual registered READ function -> Django queryset -> actual SQLite data -> formatted answer")
          try:
              execute_tool("tender.dismiss", owner, {"tender_id":1})
          except AssistantToolConfirmationRequired:
              print("PASS: actual registered ACTION requires explicit confirmation")
          else:
              raise AssertionError("Write bypassed confirmation")
          PY

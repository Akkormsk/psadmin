name: EIS PMD one-shot diagnostic
on:
  push:
    branches:
      - diagnostics/eis-pmd-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check one read-only SOAP request to EIS
        env:
          EIS_TOKEN: ${{ secrets.EIS_TOKEN }}
        run: |
          python - <<'PY'
          import os, uuid, datetime, urllib.request, urllib.error, xml.etree.ElementTree as ET
          token = os.getenv("EIS_TOKEN", "").strip()
          if not token:
              print("RESULT=SECRET_MISSING: EIS_TOKEN unavailable in this workflow")
              raise SystemExit(0)
          reg = "0372200000926000408"
          ns = "http://zakupki.gov.ru/fz44/get-docs-ip/ws"
          # Build XML using ElementTree to safely escape token rather than interpolating into XML.
          env = ET.Element("{http://schemas.xmlsoap.org/soap/envelope/}Envelope")
          head = ET.SubElement(env, "{http://schemas.xmlsoap.org/soap/envelope/}Header")
          ET.SubElement(head, "individualPerson_token").text = token
          body = ET.SubElement(env, "{http://schemas.xmlsoap.org/soap/envelope/}Body")
          method = ET.SubElement(body, "{"+ns+"}getDocsByReestrNumberRequest")
          idx = ET.SubElement(method, "index")
          ET.SubElement(idx,"id").text = str(uuid.uuid4())
          ET.SubElement(idx,"createDateTime").text = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S")
          ET.SubElement(idx,"mode").text = "PROD"
          params = ET.SubElement(method, "selectionParams")
          ET.SubElement(params,"subsystemType").text = "PRIZ"
          ET.SubElement(params,"reestrNumber").text = reg
          payload = ET.tostring(env, encoding="utf-8", xml_declaration=True)
          url = "https://int.zakupki.gov.ru/eis-integration/services/getDocsIP"
          req = urllib.request.Request(url, data=payload, method="POST", headers={"Content-Type":"text/xml; charset=utf-8"})
          print("REQUEST=one SOAP POST, target=getDocsIP, purchase="+reg)
          try:
              with urllib.request.urlopen(req, timeout=22) as response:
                  raw = response.read(300000)
                  print("HTTP_STATUS="+str(response.status))
          except urllib.error.HTTPError as exc:
              print("HTTP_STATUS="+str(exc.code))
              raw = exc.read(300000)
          except Exception as exc:
              print("RESULT=TRANSPORT_ERROR; TYPE="+type(exc).__name__)
              raise SystemExit(0)
          try:
              root = ET.fromstring(raw)
          except ET.ParseError:
              print("RESULT=NON_XML_RESPONSE")
              raise SystemExit(0)
          def name(tag): return tag.rsplit("}",1)[-1]
          errs = [e for e in root.iter() if name(e.tag) in ("errorInfo","Fault")]
          if errs:
              for e in errs[:2]:
                  fields = {name(c.tag): (c.text or "") for c in e}
                  print("RESULT=EIS_ERROR")
                  print("ERROR_CODE="+fields.get("code","missing"))
                  message = fields.get("message",fields.get("faultstring",""))
                  # Deliberately never print raw error message, as it could contain the credential.
                  print("ERROR_MESSAGE_PRESENT="+str(bool(message)))
          else:
              n = sum(name(e.tag)=="archiveUrl" for e in root.iter())
              print("RESULT=XML_RESPONSE_WITHOUT_EIS_ERROR")
              print("ARCHIVE_URL_COUNT="+str(n))
              print("ROOT_TAG="+name(root.tag))
          PY

name: Workboards isolated CI
on:
  push:
    branches:
      - feature/workboards
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test tenders.test_workboard_ownership tenders.test_commercial_items tenders.test_working_items --noinput -v 2

name: Workboards isolated CI
on:
  push:
    branches:
      - feature/workboards
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Baseline route regressions (before ownership change)
        run: |
          git fetch --no-tags --depth=1 origin c86d9917169c434efe273cb382f21f4c9d8799b4
          git worktree add --detach /tmp/workboards-baseline c86d9917169c434efe273cb382f21f4c9d8799b4
          cd /tmp/workboards-baseline
          python manage.py test tenders.test_commercial_items --noinput -v 2
        continue-on-error: true
      - name: Ownership and working tree
        run: python manage.py test tenders.test_workboard_ownership tenders.test_working_items --noinput -v 2
      - name: Existing route regressions
        if: always()
        run: python manage.py test tenders.test_commercial_items --noinput -v 2

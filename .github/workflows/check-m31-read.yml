name: M3.1 READ regression (no deploy)

on:
  push:
    branches:
      - fix/m31-generic-read-plan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
      DJANGO_SECRET_KEY: ci-only-not-production
      DJANGO_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test tenders.test_assistant_tools tenders.test_assistant_conversations --verbosity 2

name: Live TEST assistant chat verification (no deploy)
on:
  push:
    branches:
      - ops/test-read-diagnostics
permissions:
  contents: read
jobs:
  verify-real-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.PSADMIN_TEST_SSH_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.PSADMIN_TEST_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PSADMIN_TEST_SSH_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH for existing TEST only
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Invoke actual assistant against Timeweb TEST database and AI gateway
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            "deploy@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          grep -q 'bf03d4ce7ab803a1b8a4c7bdbedbd7dbbc569b25' /home/deploy/psadmin-test/.twin-version
          docker compose -f /home/deploy/psadmin-test/deploy/vds/compose.test.yml exec -T test-web python manage.py shell <<'PY'
          from uuid import uuid4
          from django.contrib.auth import get_user_model
          from tenders.assistant_conversations import create_conversation, respond
          user = get_user_model()(username="smoke_" + uuid4().hex[:12], is_superuser=True, is_staff=True)
          user.set_unusable_password()
          user.save()
          conversation = None
          try:
              conversation = create_conversation(user, "Automated read-only assistant smoke")
              results = respond(conversation, user, "Покажи последние 5 входящих тендеров. Для каждого укажи номер, название, НМЦК и текущий статус.")
              answer = results[-1]
              conversation.refresh_from_db()
              read = conversation.context.get("last_agent_read", {})
              data = read.get("result", {}) if isinstance(read, dict) else {}
              items = data.get("items", []) if isinstance(data, dict) else []
              print("REAL_AI_TOOL:", read.get("tool_id") if isinstance(read, dict) else "(none)")
              print("REAL_AI_RECORD_COUNT:", len(items))
              print("REAL_AI_MESSAGE_LENGTH:", len(answer.get("text", "")))
              print("REAL_AI_HAS_NMCK:", "НМЦК" in answer.get("text", ""))
              print("REAL_AI_HAS_STATUS:", "статус:" in answer.get("text", "").lower())
              assert read.get("tool_id") == "tender.list", "Model did not call registered business read tool"
              assert items, "Registered tool returned no currently visible incoming records"
              assert all(set(("number", "name", "maximum_price", "status")).issubset(row) for row in items)
              assert "НМЦК" in answer["text"] and "статус:" in answer["text"].lower()
              assert answer["role"] == "assistant"
              print("REAL_AI_CHAT_PASS: real model selected tool; Django returned business fields; human-readable answer present")
          finally:
              if conversation is not None:
                  conversation.feedback_events.all().delete()
                  conversation.delete()
              user.delete()
          PY
          REMOTE

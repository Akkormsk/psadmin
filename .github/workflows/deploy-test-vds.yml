name: Deploy test VDS

on:
  push:
    branches:
      - test-server
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA from test-server; leave empty for the selected branch HEAD"
        required: false
        type: string

      document_pilot_tender:
        description: "Optional single-tender document pilot (purchase number); empty means no AI calls"
        required: false
        default: ""
        type: string

      document_pilot_check_only:
        description: "Prepare full document input and inspect budget without model calls"
        required: false
        default: false
        type: boolean

      document_pilot_full_refresh:
        description: "Verify the normal Update service and a model-blocked cache repeat for exactly the pilot tender"
        required: false
        default: false
        type: boolean

      inspect_tender_number:
        description: "Read-only inspection of one deployed TEST tender; skips deployment and model calls"
        required: false
        default: ""
        type: string

      refresh_estimates:
        description: "TEST maintenance: preview or apply accepted requirements to untouched legacy lines; no deployment"
        required: false
        default: ""
        type: string
      refresh_estimates_digest:
        description: "Exact preview digest required for apply"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: psadmin-test-vds-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/test-server' && !inputs.inspect_tender_number && !inputs.refresh_estimates
    runs-on: ubuntu-latest
    env:
      TEST_URL: https://test.admin.psodin.ru
      REMOTE_ARCHIVE: /home/deploy/psadmin-test-${{ github.run_id }}.tar.gz
      SSH_HOST: ${{ secrets.PSADMIN_TEST_SSH_HOST }}
      SSH_USER: deploy
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Verify deployment source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin test-server
          git merge-base --is-ancestor "$deploy_sha" origin/test-server
          printf 'sha=%s\n' "$deploy_sha" >> "$GITHUB_OUTPUT"
          git archive --format=tar "$deploy_sha" | gzip -9 > psadmin-test.tar.gz

      - name: Configure strict SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PSADMIN_TEST_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PSADMIN_TEST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release archive
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            psadmin-test.tar.gz "$SSH_USER@$SSH_HOST:$REMOTE_ARCHIVE"

      - name: Activate test release and run twin
        shell: bash
        env:
          DOCUMENT_PILOT_TENDER: ${{ inputs.document_pilot_tender || '' }}
          DOCUMENT_PILOT_CHECK_ONLY: ${{ inputs.document_pilot_check_only && '1' || '0' }}
          DOCUMENT_PILOT_FULL_REFRESH: ${{ inputs.document_pilot_full_refresh && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ -n "$DOCUMENT_PILOT_TENDER" ] && ! [[ "$DOCUMENT_PILOT_TENDER" =~ ^[0-9]{19}$ ]]; then
            echo "Invalid pilot purchase number" >&2; exit 2
          fi
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" "bash -s -- '${{ steps.source.outputs.sha }}' '$REMOTE_ARCHIVE' '$DOCUMENT_PILOT_TENDER' '$DOCUMENT_PILOT_CHECK_ONLY' '$DOCUMENT_PILOT_FULL_REFRESH'" <<'REMOTE'
          set -euo pipefail

          deploy_sha="$1"
          archive="$2"
          pilot_tender="${3:-}"
          pilot_check_only="${4:-0}"
          pilot_full_refresh="${5:-0}"
          root=/home/deploy
          app="$root/psadmin-test"
          rollback_root="$root/psadmin-test-rollbacks"
          stage="$(mktemp -d "$root/psadmin-test.new.XXXXXX")"
          rollback_dir=not-created

          diagnose() {
            echo "::error::Test deployment failed. Test service status and recent logs follow."
            docker compose -f "$app/deploy/vds/compose.test.yml" ps || true
            docker compose -f "$app/deploy/vds/compose.test.yml" logs --tail 100 test-web || true
            echo "The previous release is kept in: $rollback_dir"
          }
          cleanup() {
            rm -f "$archive"
            if [ -n "$stage" ] && [ -d "$stage" ]; then rm -rf "$stage"; fi
          }
          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then diagnose; fi
            cleanup
            exit "$status"
          }
          trap on_exit EXIT

          case "$deploy_sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "Invalid deployment SHA" >&2; exit 2 ;;
          esac
          [ -d "$app" ] || { echo "Missing test application directory: $app" >&2; exit 2; }
          [ -f "$app/.twin-version" ] || { echo "Missing $app/.twin-version; record the currently deployed test SHA before enabling Actions." >&2; exit 2; }
          previous_sha="$(grep -Eo '[0-9a-f]{40}' "$app/.twin-version" | head -1)"
          case "$previous_sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "Could not determine the previous test SHA" >&2; exit 2 ;;
          esac

          tar -xzf "$archive" -C "$stage"
          [ -x "$stage/deploy/vds/twin.sh" ] || { echo "Release archive has no executable deploy/vds/twin.sh" >&2; exit 2; }
          mkdir -p "$rollback_root"
          rollback_dir="$rollback_root/$previous_sha-$(date -u +%Y%m%dT%H%M%SZ)"
          printf 'sha=%s\nprevious_sha=%s\ndeployed_at=%s\n' "$deploy_sha" "$previous_sha" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$stage/.twin-version"
          mv "$app" "$rollback_dir"
          mv "$stage" "$app"
          stage=""

          cd "$app/deploy/vds"
          ./twin.sh up </dev/null
          docker compose -f compose.test.yml ps test-web
          test "$(sed -n 's/^sha=//p' ../../.twin-version)" = "$deploy_sha"
          docker compose -f compose.test.yml exec -T test-web python - <<'PY'
          import json
          import os

          model = os.getenv("TIMEWEB_AI_ASSISTANT_MODEL")
          base_url = os.getenv("TIMEWEB_AI_BASE_URL")
          key_configured = bool(os.getenv("TIMEWEB_AI_API_KEY", "").strip())
          assert model == "anthropic/claude-haiku-5-5", "Unexpected TEST assistant model"
          assert base_url == "https://api.timeweb.ai/v1", "Unexpected TEST Gateway URL"
          assert key_configured, "TEST Gateway key is missing"
          print(json.dumps({"assistant_model": model, "base_url": base_url, "key_configured": key_configured}))

          import django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "mysite.settings")
          django.setup()
          from django.conf import settings
          from tenders.models import TenderComputeJob
          from tenders.calculation_v2_pipeline import GatewayDocumentEnricher
          latest_job = TenderComputeJob.objects.filter(version__startswith="v2").order_by("-pk").values("status", "updated_at", "completed_at").first()
          print("Tender analysis runtime: " + json.dumps({
              "enabled": settings.CALCULATION_V2_ENABLED,
              "extraction_model": GatewayDocumentEnricher().model,
              "latest_job": latest_job,
          }, default=str))
          PY
          if [ -n "$pilot_tender" ]; then
            pilot_mode=--apply
            if [ "$pilot_check_only" = 1 ]; then pilot_mode=--preflight; fi
            pilot_extra=()
            if [ "$pilot_full_refresh" = 1 ]; then pilot_extra=(--full-refresh); fi
            docker compose -f compose.test.yml exec -T test-web python manage.py prepare_tender_documents \
              --tender-number "$pilot_tender" --max-cost-rub 14 --max-output-tokens 32000 "$pilot_mode" "${pilot_extra[@]}" </dev/null
          fi
          curl --fail --silent --show-error --max-time 20 \
            --resolve test.admin.psodin.ru:443:127.0.0.1 \
            https://test.admin.psodin.ru/ > /dev/null
          echo "Deployed SHA: $deploy_sha"
          echo "Previous SHA: $previous_sha"
          echo "Rollback source directory: $rollback_dir"
          REMOTE

      - name: Verify public test URL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 20 "$TEST_URL" > /dev/null

      - name: Collect diagnostics after failure
        if: ${{ failure() }}
        shell: bash
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" 'docker compose -f /home/deploy/psadmin-test/deploy/vds/compose.test.yml ps; docker compose -f /home/deploy/psadmin-test/deploy/vds/compose.test.yml logs --tail 100 test-web' || true

  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_tender_number != '' && (github.ref == 'refs/heads/test-server' || github.ref == 'refs/heads/feature/m3-agent-simple')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.PSADMIN_TEST_SSH_HOST }}
      SSH_USER: deploy
      INSPECT_NUMBER: ${{ inputs.inspect_tender_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PSADMIN_TEST_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PSADMIN_TEST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect deployed TEST data without writes
        run: |
          set -euo pipefail
          [[ "$INSPECT_NUMBER" =~ ^[0-9]{19}$ ]]
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" "cat /home/deploy/psadmin-test/.twin-version"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" "cd /home/deploy/psadmin-test/deploy/vds && docker compose -f compose.test.yml exec -T -e INSPECT_TENDER_NUMBER=$INSPECT_NUMBER test-web python -" < scripts/inspect_tender_analysis.py

  refresh_estimates:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_estimates != '' && github.ref == 'refs/heads/feature/m3-agent-simple'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.PSADMIN_TEST_SSH_HOST }}
      SSH_USER: deploy
      REFRESH_MODE: ${{ inputs.refresh_estimates }}
      REFRESH_DIGEST: ${{ inputs.refresh_estimates_digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PSADMIN_TEST_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PSADMIN_TEST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Refresh TEST estimate requirements with reviewed plan
        run: |
          set -euo pipefail
          [[ "$REFRESH_MODE" = preview || "$REFRESH_MODE" = apply ]]
          [[ -z "$REFRESH_DIGEST" || "$REFRESH_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" "cat /home/deploy/psadmin-test/.twin-version"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" "cd /home/deploy/psadmin-test/deploy/vds && docker compose -f compose.test.yml exec -T -e REFRESH_ESTIMATES_MODE=$REFRESH_MODE -e REFRESH_ESTIMATES_DIGEST=$REFRESH_DIGEST test-web python -" < scripts/sync_test_estimate_requirements.py

          if [ "$REFRESH_MODE" = apply ]; then
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
              "$SSH_USER@$SSH_HOST" "cd /home/deploy/psadmin-test/deploy/vds && docker compose -f compose.test.yml cp test-web:/app/private_maintenance_backups /home/deploy/psadmin-test-maintenance-backups-${{ github.run_id }}"
          fi

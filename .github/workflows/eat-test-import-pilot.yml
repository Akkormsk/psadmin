name: EAT TEST import smoke check

on:
  push:
    branches:
      - feature/eat-readonly-diagnostic

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_HOST: ${{ secrets.PSADMIN_TEST_SSH_HOST }}
      SSH_USER: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict TEST SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PSADMIN_TEST_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PSADMIN_TEST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify deployed EAT importer via bounded TEST database pilot
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" "cd /home/deploy/psadmin-test/deploy/vds && docker compose -f compose.test.yml exec -T test-web python manage.py shell -c 'import json; from tender_selection.eat_service import run_eat_pull; from tender_selection.models import Tender; r=run_eat_pull(detail_limit=5); print(\"EAT_TEST_PILOT \"+json.dumps({\"ok\":r.ok,\"created\":r.created_count,\"updated\":r.updated_count,\"received\":r.records_received,\"error\":r.error,\"diagnostics\":r.params.get(\"diagnostics\"),\"eat_rows\":Tender.objects.filter(source=\"eat\").count()},default=str)); assert r.ok, \"EAT run failed\"' "

# Service names differ from prod's: caddy sees both stacks, so a shared "web" name would be ambiguous.
# Test twin at test.admin.psodin.ru: own code dir (~/psadmin-test), own copy of the prod DB.
name: psadmin-test

services:
  test-web:
    build:
      context: ../..
      dockerfile: deploy/vds/Dockerfile
    env_file: ../../../psadmin-test.env
    restart: unless-stopped
    mem_limit: 600m
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,urllib.request as u; u.urlopen('http://%s:8000/' % socket.gethostbyname(socket.gethostname()), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  test-db:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 300m
    command: postgres -c shared_buffers=64MB -c max_connections=20
    env_file: ../../../psadmin-test.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "psadmin", "-d", "psadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge:
    name: psadmin-edge
    external: true

volumes:
  pgdata:

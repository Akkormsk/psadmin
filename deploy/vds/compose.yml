name: psadmin

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/vds/Dockerfile
    env_file: .env
    restart: unless-stopped
    mem_limit: 1400m
    healthcheck:
      # InternalHealthCheckMiddleware answers "ok" only for a private, non-loopback Host.
      test: ["CMD", "python", "-c", "import socket,urllib.request as u; u.urlopen('http://%s:8000/' % socket.gethostbyname(socket.gethostname()), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
